name: CI

# This repository previously had no CI at all: the only workflows notified
# Discord on commits and issues. Several defects reached production while every
# visible signal stayed green, so this gate exists to make the cheap checks
# unskippable.
#
# Jobs:
#   backend-tests  - the pytest suite (no network: providers are patched)
#   app-boot       - the real production boot path, on a cold database
#   frontend       - tsc + production build
#
# The boot job is the important one. The app used to let every gunicorn worker
# race on a cold database, and the losers died with "table user already exists"
# (0/3 cold starts survived at the production worker count). No static check could
# see that. It also asserts the SECRET_KEY guard, by booting four real workers
# from a cold database and checking that sessions survive across them.

# TRIGGERS ARE MANUAL ON PURPOSE - do not re-add push/pull_request without reading this.
#
# This repo is PRIVATE, so GitHub Actions minutes bill against the account (public repos
# are free). A push here used to run the jobs below automatically. On kpwarz2 this was
# measured at ~18 BILLED minutes per push - jobs bill separately and round UP per job, so
# the true cost is the SUM, not the wall-clock the run displays. Left alone it exhausts the
# account allowance, and then every job refuses to start at all with
# "recent account payments have failed".
#
# Run it deliberately when a change warrants the runner:
#   gh workflow run ci
# Otherwise use the local gates. Push and pull cost nothing; only Actions minutes do.
on:
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          SECRET_KEY: ci-only-secret-key-not-used-in-production-32ch
          FLASK_DEBUG: 'true'
        run: python -m pytest tests/ -q

  app-boot:
    name: Boots from a cold database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Bootstrap a fresh database, as the container entrypoint does
        env:
          SECRET_KEY: ci-only-secret-key-not-used-in-production-32ch
        run: |
          mkdir -p ci-data
          DATABASE_URL=sqlite:///${{ github.workspace }}/ci-data/books.db python -m app.bootstrap

      - name: Four real workers share one database, then one session across them
        env:
          SECRET_KEY: ci-only-secret-key-not-used-in-production-32ch
        run: |
          export DATABASE_URL=sqlite:///${{ github.workspace }}/ci-data/books.db
          gunicorn -w 4 --preload -b 127.0.0.1:5054 --timeout 60 \
            --access-logfile - --error-logfile - run:app &
          GUNICORN_PID=$!

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5054/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done

          echo "health: $(curl -fsS http://127.0.0.1:5054/api/health)"

          # One session cookie, 24 requests. If the key were generated per worker
          # (the old fallback) a session signed by one worker would be rejected by
          # the others with 302s sprinkled through these responses.
          python - <<'PY'
          import http.cookiejar, urllib.request, urllib.error, sys

          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          base = 'http://127.0.0.1:5054'

          statuses = []
          for _ in range(24):
              try:
                  with opener.open(f'{base}/api/health', timeout=10) as response:
                      statuses.append(response.status)
              except urllib.error.HTTPError as exc:
                  statuses.append(exc.code)

          if set(statuses) != {200}:
              print(f'FAIL: inconsistent responses across workers: {sorted(set(statuses))}')
              sys.exit(1)
          print(f'OK: {len(statuses)} requests, all 200, session stable across workers')
          PY

          kill $GUNICORN_PID

      - name: The app refuses a missing SECRET_KEY
        env:
          DATABASE_URL: sqlite:///${{ github.workspace }}/ci-data/books.db
        run: |
          if env -u SECRET_KEY python -c "import run" 2>/dev/null; then
            echo "::error::the app started without SECRET_KEY, so the auth-bypass guard is not working"
            exit 1
          fi
          echo "Correctly refused to start without SECRET_KEY"

      - name: The app refuses the publicly-known placeholder key
        env:
          DATABASE_URL: sqlite:///${{ github.workspace }}/ci-data/books.db
          SECRET_KEY: your-secret-key
        run: |
          if python -c "import run" 2>/dev/null; then
            echo "::error::STARTED WITH THE HARDCODED PLACEHOLDER KEY"
            exit 1
          fi
          echo "Correctly refused the known public key"

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # Lint could not run at all before this change: the config was written for
        # ESLint 9 flat config but package.json pinned ESLint 8 plus the deprecated
        # per-package @typescript-eslint/* split, and the script still passed the
        # ESLint 8 --ext flag. Errors must be zero. The remaining warnings are the
        # `no-explicit-any` backlog at API boundaries, held at a ratchet (150) so
        # they cannot grow while the typing work happens.
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
