version: '3.8'
name: bookoracle

services:
  backend:
    container_name: bookoracle-backend
    build: .
    ports:
      # Loopback-only. Host nginx (server_name books.ilgaming.xyz) proxies
      # /api/ and /static/ here. This used to publish on 0.0.0.0, which put the
      # Flask API directly on the LAN and bypassed nginx entirely: any device on
      # the network could reach http://192.168.0.27:5054/ without TLS, without
      # Cloudflare, and outside the site's security headers.
      #
      # IMPORTANT: nginx must proxy to 127.0.0.1:5054, not localhost:5054.
      # `localhost` can resolve to ::1 first, and this bind does not listen on
      # IPv6. Getting that wrong makes every /api/* request 502 while the SPA
      # shell still loads. The nginx site on the prod box was updated in the same
      # change.
      - "127.0.0.1:5054:5054"
    volumes:
      # Bind mount, matching what production actually runs: the database lives
      # at /home/steam/apps/data/bookoracle on the host. The parent directory
      # must exist before `docker compose up` (data/bookoracle relative to this
      # repo directory is created automatically by Compose if the parent does).
      - ../data/bookoracle:/app/data
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - SECURITY_PASSWORD_SALT=${SECURITY_PASSWORD_SALT}
      - TIMEZONE=${TIMEZONE:-UTC}
      - WORKERS=${WORKERS:-4}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Mail settings for password recovery
      - MAIL_SERVER=${MAIL_SERVER}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USE_TLS=${MAIL_USE_TLS}
      - MAIL_USE_SSL=${MAIL_USE_SSL}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_DEFAULT_SENDER=${MAIL_DEFAULT_SENDER}
      # Optional. Unset means external search uses OpenLibrary only, because
      # this project's Google Books anonymous quota is exhausted.
      - GOOGLE_BOOKS_API_KEY=${GOOGLE_BOOKS_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5054/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    container_name: bookoracle-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      # Loopback-only, same reasoning as the backend: the SPA is served to the
      # public through host nginx, not directly off the LAN.
      - "127.0.0.1:3505:80"
    depends_on:
      - backend
    restart: unless-stopped

