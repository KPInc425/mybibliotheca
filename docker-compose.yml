version: '3.8'
name: bookoracle

services:
  backend:
    container_name: bookoracle-backend
    build: .
    ports:
      - "5054:5054"   # Host Nginx proxies /api and /static to this
    volumes:
      # Bind mount, matching what production actually runs: the database lives
      # at /home/steam/apps/data/bookoracle on the host. The parent directory
      # must exist before `docker compose up` (data/bookoracle relative to this
      # repo directory is created automatically by Compose if the parent does).
      - ../data/bookoracle:/app/data
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - SECURITY_PASSWORD_SALT=${SECURITY_PASSWORD_SALT}
      - TIMEZONE=${TIMEZONE:-UTC}
      - WORKERS=${WORKERS:-4}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Mail settings for password recovery
      - MAIL_SERVER=${MAIL_SERVER}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USE_TLS=${MAIL_USE_TLS}
      - MAIL_USE_SSL=${MAIL_USE_SSL}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_DEFAULT_SENDER=${MAIL_DEFAULT_SENDER}
      # Optional. Unset means external search uses OpenLibrary only, because
      # this project's Google Books anonymous quota is exhausted.
      - GOOGLE_BOOKS_API_KEY=${GOOGLE_BOOKS_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5054/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    container_name: bookoracle-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3505:80"     # Host Nginx proxies / to this (SPA)
    depends_on:
      - backend
    restart: unless-stopped

